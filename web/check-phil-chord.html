<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chord view — render check</title>
<!--
  Renders phil-chord.js on its own, against the real philpapers-chord.json.

  The full app pulls a 54 MB unrelated dataset before it shows anything, which
  makes it a slow and flaky way to look at this one view. This page loads only
  the chord view, so it paints in well under a second and can be opened
  directly while iterating on the renderer.

  It is a mirror of the host app's call sequence (switchMode -> renderLegend ->
  draw), so if the view works here but not there, the problem is in the wiring
  in main.js, not in the renderer.

      python -m http.server 8756      # from this directory
      open http://localhost:8756/check-phil-chord.html
-->
<style>
  :root { --bg:#000; --panel:rgba(8,10,13,0.62); --border:rgba(255,255,255,0.1);
          --fg:#e6edf3; --muted:#8b949e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg);
              color:var(--fg); font-family:-apple-system,"Segoe UI",sans-serif; }
  #graph { position:fixed; inset:0; display:block; width:100%; height:100%; }
  .panel { position:fixed; z-index:10; background:var(--panel); border:1px solid var(--border);
           border-radius:8px; padding:10px 14px; backdrop-filter:blur(10px); font-size:12.5px;
           line-height:1.6; }
  #hud { bottom:62px; left:14px; display:flex; flex-direction:column; gap:6px; }
  #hud .hud-row { display:flex; gap:14px; align-items:flex-start; }
  #hud .gauge { display:flex; flex-direction:column; align-items:flex-start; }
  #hud .gauge b { font-size:13px; }
  #hud .gauge span { color:var(--muted); font-size:11px; }
  #hoverInfo { color:var(--muted); font-size:11px; max-width:340px; min-height:18px;
               white-space:pre-line; border-bottom:1px solid var(--border);
               padding-bottom:6px; margin-bottom:4px; }
  #legend { overflow-y:auto; min-width:170px; scrollbar-width:none; }
  #legend::-webkit-scrollbar { width:0; height:0; }
  body.philosophy-mode #legend { max-width:300px; max-height:60vh; scrollbar-width:thin; }
  body.philosophy-mode #legend::-webkit-scrollbar { width:6px; height:6px; }
  body.philosophy-mode #legend::-webkit-scrollbar-thumb {
    background:rgba(255,255,255,0.18); border-radius:3px; }
  #legend .sw { display:inline-block; width:10px; height:10px; border-radius:50%;
                margin-right:8px; vertical-align:middle; }
  #legend .item { cursor:pointer; padding:2px 4px; border-radius:4px; }
  #legend .item:hover { background:rgba(255,255,255,0.08); }
  #legend .item.off { opacity:0.3; }
  #legend .cnt { color:var(--muted); font-size:11px; margin-left:auto; }
  #legend .row { display:flex; align-items:center; justify-content:space-between; }
  #err { position:fixed; top:12px; left:12px; right:12px; z-index:60; display:none;
         background:#2b1113; border:1px solid #6d2b2f; border-radius:8px; padding:10px 14px;
         font:12px ui-monospace,Consolas,monospace; color:#ffb3b3; white-space:pre-wrap; }
</style>
</head>
<body>
  <canvas id="graph"></canvas>

  <div id="hud" class="panel">
    <div id="hoverInfo"></div>
    <div class="hud-row">
      <div class="gauge"><b id="nodeCount">-</b><span>Categories</span></div>
      <div class="gauge"><b id="edgeCount">-</b><span>Cross-listings</span></div>
      <div id="legend"></div>
    </div>
  </div>

  <div id="err"></div>

<script type="module">
import { createChordView } from './phil-chord.js';

const err = document.getElementById('err');
function fail(what, e) {
  err.style.display = 'block';
  err.textContent += `${what}: ${e && (e.stack || e.message) || e}\n`;
}
window.addEventListener('error', (e) => fail('error', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => fail('rejection', e.reason));

// 记录每次 fillText，用**浏览器真实字体度量**重建标签盒，检查有没有两个标签叠在一起。
// Node 那边的 check-phil-chord.mjs 用的是替身的近似宽度，只能验证「避让算法把所有
// 重叠对都分开了」；字体度量本身准不准，只有这里能问。
//
// 结果写进 document.title，所以 headless 可以直接读：
//     msedge --headless=new --dump-dom "…/check-phil-chord.html?w=1280&h=720"
const proto = CanvasRenderingContext2D.prototype;
const realFillText = proto.fillText;
let texts = [];
proto.fillText = function (text, x, y) {
  texts.push({
    text: String(text), x, y, align: this.textAlign, font: this.font,
    width: this.measureText(String(text)).width,
  });
  return realFillText.apply(this, arguments);
};
function labelOverlaps() {
  const boxes = texts.map((t) => {
    const x0 = t.align === 'right' ? t.x - t.width
      : t.align === 'center' ? t.x - t.width / 2 : t.x;
    return { x0, x1: x0 + t.width, y0: t.y - 7, y1: t.y + 7, text: t.text };
  });
  const out = [];
  for (let i = 0; i < boxes.length; i++) {
    for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i], b = boxes[j];
      const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
      const oy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
      if (ox > 1 && oy > 1) out.push(`${a.text} / ${b.text} (${ox.toFixed(0)}x${oy.toFixed(0)})`);
    }
  }
  return out;
}

// 尺寸可以用 ?w=&h= 固定，方便脚本遍历几个窗口大小。
const q = new URLSearchParams(location.search);
const fixedW = +(q.get('w') || 0), fixedH = +(q.get('h') || 0);

const view = createChordView();
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
let dpr = 1, cssW = 0, cssH = 0;

function paint() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  texts = [];
  view.draw(ctx, cssW, cssH, dpr);
  const meta = view.getData()?.meta;
  document.getElementById('nodeCount').textContent = meta ? meta.categories.toLocaleString() : '-';
  document.getElementById('edgeCount').textContent = meta ? meta.parentPairs.toLocaleString() : '-';
  const clashes = labelOverlaps();
  document.title = `overlaps=${clashes.length} size=${cssW}x${cssH}`;
  if (clashes.length) fail('label overlap', clashes.slice(0, 4).join('; '));
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = fixedW || innerWidth;
  cssH = fixedH || innerHeight;
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  paint();
}
// Hover and click, mirroring the host's handlers, so the tooltip path is exercised too.
const same = (a, b) => (!a || !b) ? (!a && !b) : view.sameTarget(a, b);
canvas.addEventListener('mousemove', (ev) => {
  const r = canvas.getBoundingClientRect();
  const hit = view.pick(ev.clientX - r.left, ev.clientY - r.top);
  if (same(hit, view.getHover())) return;
  view.setHover(hit);
  document.getElementById('hoverInfo').textContent =
    hit ? view.describe(hit) : view.describe(view.getPinned());
  paint();
});
canvas.addEventListener('click', (ev) => {
  const r = canvas.getBoundingClientRect();
  view.togglePinned(view.pick(ev.clientX - r.left, ev.clientY - r.top));
  document.getElementById('hoverInfo').textContent =
    view.describe(view.getPinned() || view.getHover());
  paint();
});
canvas.addEventListener('mouseleave', () => { view.setHover(null); paint(); });
window.addEventListener('resize', resize);

try {
  const res = await fetch('./philpapers-chord.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(`philpapers-chord.json -> HTTP ${res.status}`);
  view.setData(await res.json());
  document.body.classList.add('philosophy-mode');
  // Same order the host uses: legend, then inset, then paint.
  view.renderLegend(document.getElementById('legend'));
  resize();   // paint() 会写 document.title，别再覆盖它
} catch (e) {
  fail('load', e);
}
</script>
</body>
</html>
