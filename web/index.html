<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数学概念历史地图 · mathlib4</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: rgba(22, 27, 34, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --fg: #e6edf3;
      --muted: #8b949e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    #graph { display: block; width: 100%; height: 100%; cursor: grab; }
    #graph:active { cursor: grabbing; }

    .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px); font-size: 12.5px; line-height: 1.6; }
    #title { top: 14px; left: 14px; max-width: 300px; }
    #title h1 { font-size: 15px; margin-bottom: 2px; }
    #title p { color: var(--muted); font-size: 11.5px; }
    #status { top: 14px; right: 14px; text-align: right; min-width: 150px; }
    #status b { color: #79c0ff; }
    #hud { bottom: 62px; left: 14px; display: flex; gap: 14px; align-items: flex-start; transition: opacity 0.15s; }
    #hud.collapsed { display: none; }
    #hud .gauge { display: flex; flex-direction: column; align-items: flex-start; }
    #hud .gauge b { font-size: 13px; }
    #hud .gauge span { color: var(--muted); font-size: 11px; }
    #legend { max-height: 46vh; overflow-y: auto; min-width: 170px; }
    #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    #legend .item { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
    #legend .item:hover { background: rgba(255,255,255,0.08); }
    #legend .item.off { opacity: 0.3; }
    #legend .cnt { color: var(--muted); font-size: 11px; margin-left: auto; }
    #legend .row { display: flex; align-items: center; justify-content: space-between; }

    #toolbar { bottom: 14px; right: 14px; display: flex; gap: 8px; }
    #toolbar button { background: rgba(120,140,170,0.15); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    #toolbar button:hover { background: rgba(120,140,170,0.3); }
    #toolbar button.active { background: #58a6ff; border-color: #58a6ff; color: #0d1117; font-weight: 600; }
    #toolbar .sep { width: 1px; background: var(--border); margin: 2px 0; }

    #zoombar { bottom: 14px; left: 14px; padding: 4px; }
    #zoombar button { width: 32px; height: 32px; font-size: 20px; line-height: 1; background: rgba(120,140,170,0.15); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    #zoombar button:hover { background: rgba(120,140,170,0.3); }

    #searchbox { top: 60px; right: 14px; width: 220px; }
    #searchbox input { width: 100%; background: rgba(0,0,0,0.35); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; outline: none; }
    #searchbox input:focus { border-color: #58a6ff; }
    #searchbox .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }

    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: var(--bg); z-index: 50; }
    #loading.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--muted); font-size: 13px; }

    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(22,27,34,0.95); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-size: 12.5px; color: var(--fg); z-index: 60; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="graph"></canvas>

  <div id="title" class="panel">
    <h1>🧮 数学声明历史地图</h1>
    <p>横轴=学科簇(按首次进库时间排) · 纵轴=结构深度 · 16:9 科研绘图</p>
    <p>滚轮缩放 · 拖拽平移 · 悬停看声明 · 放大看标签</p>
  </div>

  <div id="status" class="panel">
    <div>缩放 <b id="zoomK">1.0×</b> · <span id="lodLabel">三层抽象</span></div>
    <div id="hoverInfo" style="color:var(--muted); font-size:11px;"></div>
  </div>

  <div id="searchbox" class="panel">
    <input id="search" type="text" placeholder="搜索声明，如 kernel / Cauchy / group…" />
    <div class="hint" id="searchHint"></div>
  </div>

  <div id="hud" class="panel">
    <div class="gauge"><b id="nodeCount">–</b><span>声明总数</span></div>
    <div class="gauge"><b id="edgeCount">–</b><span>依赖连线</span></div>
    <div id="legend"></div>
  </div>

  <div id="toolbar" class="panel">
    <button id="btnOverview" class="active">🌐 整体模式</button>
    <button id="btnNetwork">🔗 网络模式</button>
    <span class="sep"></span>
    <button id="btnFit">⤢ 重置视图</button>
  </div>

  <div id="zoombar" class="panel">
    <button id="btnHudToggle" title="收起图例面板">−</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loadingText">加载声明地图数据（15.3 万节点，约 17.7 MB）…</p>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
