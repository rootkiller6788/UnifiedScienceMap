<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Science Map</title>
  <style>
    :root {
      --bg: #000;
      --panel: rgba(8, 10, 13, 0.62);
      --border: rgba(255, 255, 255, 0.1);
      --fg: #e6edf3;
      --muted: #8b949e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    #glgraph, #graph { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #glgraph { z-index: 0; pointer-events: none; }
    #graph { z-index: 1; cursor: grab; }
    #graph:active { cursor: grabbing; }

    .panel { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(10px); box-shadow: 0 14px 42px rgba(0,0,0,0.42); font-size: 12.5px; line-height: 1.6; }
    #hud { bottom: 62px; left: 14px; display: flex; flex-direction: column; gap: 6px; transition: opacity 0.15s; }
    #hud.collapsed { display: none; }
    #hud .hud-row { display: flex; gap: 14px; align-items: flex-start; }
    #hud .gauge { display: flex; flex-direction: column; align-items: flex-start; }
    #hud .gauge b { font-size: 13px; }
    #hud .gauge span { color: var(--muted); font-size: 11px; }
    #hoverInfo { color: var(--muted); font-size: 11px; max-width: 340px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 4px; min-height: 18px; }
    #legend { max-height: 46vh; overflow-y: auto; min-width: 170px; scrollbar-width: none; -ms-overflow-style: none; }
    #legend::-webkit-scrollbar { width: 0; height: 0; }
    #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
    #legend .item { cursor: pointer; padding: 2px 4px; border-radius: 4px; }
    #legend .item:hover { background: rgba(255,255,255,0.08); }
    #legend .item.off { opacity: 0.3; }
    #legend .cnt { color: var(--muted); font-size: 11px; margin-left: auto; }
    #legend .row { display: flex; align-items: center; justify-content: space-between; }

    #toolbar { bottom: 14px; right: 14px; display: flex; gap: 8px; }
    #toolbar button { background: rgba(255,255,255,0.06); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    #toolbar button:hover { background: rgba(255,255,255,0.12); }
    #toolbar button.active { background: rgba(255,255,255,0.86); border-color: rgba(255,255,255,0.92); color: #030303; font-weight: 600; }
    #toolbar .sep { width: 1px; background: var(--border); margin: 2px 0; }

    #zoombar { bottom: 14px; left: 14px; padding: 4px; }
    #zoombar button { width: 32px; height: 32px; font-size: 20px; line-height: 1; background: rgba(255,255,255,0.06); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    #zoombar button:hover { background: rgba(255,255,255,0.12); }

    #searchbox { top: 14px; right: 14px; width: 220px; }
    #searchbox input { width: 100%; background: rgba(0,0,0,0.35); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; outline: none; }
    #searchbox input:focus { border-color: #58a6ff; }
    #searchbox .hint { color: var(--muted); font-size: 11px; margin-top: 5px; }
    #fpsPanel { top: 14px; left: 14px; min-width: 86px; padding: 6px 10px; display: none; }
    #fpsPanel .label { color: var(--muted); font-size: 10px; letter-spacing: 0; text-transform: uppercase; }
    #fpsPanel .value { display: block; color: var(--fg); font-size: 18px; font-weight: 650; line-height: 1.15; }

    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: var(--bg); z-index: 50; }
    #loading.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--muted); font-size: 13px; }

    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(22,27,34,0.95); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; font-size: 12.5px; color: var(--fg); z-index: 60; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="glgraph"></canvas>
  <canvas id="graph"></canvas>

  <div id="searchbox" class="panel">
    <input id="search" type="text" placeholder="Search declarations, e.g. kernel / Cauchy / group..." />
    <div class="hint" id="searchHint"></div>
  </div>

  <div id="fpsPanel" class="panel">
    <span class="label">FPS</span>
    <span id="fpsValue" class="value">--</span>
  </div>

  <div id="hud" class="panel">
    <div id="hoverInfo"></div>
    <div class="hud-row">
      <div class="gauge"><b id="nodeCount">-</b><span>Declarations</span></div>
      <div class="gauge"><b id="edgeCount">-</b><span>Relations</span></div>
      <div id="legend"></div>
    </div>
  </div>

  <div id="toolbar" class="panel">
    <button id="btnOverview" class="active">Overview</button>
    <button id="btnNetwork">Network</button>
    <span class="sep"></span>
    <button id="btnFit">Fit View</button>
  </div>

  <div id="zoombar" class="panel">
    <button id="btnHudToggle" title="Hide legend">-</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loadingText">Loading unified science map data...</p>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
